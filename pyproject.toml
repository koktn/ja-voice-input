[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ja-voice-input"
version = "0.1.0"
description = "macOS 向けローカル日本語音声入力ツール(coding agent への音声指示用)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # numpy<2.5: mlx-whisper 経由の numba が numpy<2.5 を要求するため上限を切る。
    # 外すと resolver が古い numba(Python<3.10 のみ対応)まで遡って sync が失敗する。
    "numpy>=1.24,<2.5",
    "sounddevice>=0.4.6",
    "pynput>=1.7.6",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# 音声認識バックエンド(どちらか一方を入れる)
whispercpp = ["pywhispercpp>=1.2"]
mlx = ["mlx-whisper>=0.4"]
# 無音検出の精度向上(未導入時は RMS ベースにフォールバック)
vad = ["webrtcvad-wheels>=2.0.10"]
dev = ["pytest>=8.0"]

[project.scripts]
ja-voice-input = "ja_voice_input.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
